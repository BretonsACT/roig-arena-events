name: Scrape Roig Arena Events & Deploy iCal Feed

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Unified Scraper & Generate iCal (.ics) Feed
        run: |
          python3 create_calendar.py

      - name: Commit & Push Calendar Updates to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Roig_Arena_Events.ics events.json status.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync calendar events [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No calendar changes detected; skipping commit."
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scrape-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
